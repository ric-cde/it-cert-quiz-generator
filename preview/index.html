<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz App Preview</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --ink: #1f2328; --muted: #68707a; --line: #dfe1e4;
  --accent: #3657c9; --accent-soft: #e9edfb; --green: #2f9e62; --green-soft: #e4f5ec;
  --yellow: #e3b21a; --yellow-soft: #fbf3d5; --red: #cf4a4a; --red-soft: #fbe9e9;
  --code: #20242b; --radius: 8px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.25; }
h2 { font-size: 16px; margin: 24px 0 8px; }
h3 { font-size: 14px; margin: 16px 0 6px; }
p { margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.banner { background: var(--ink); color: #fff; font-size: 12px; padding: 5px 16px; text-align: center; }
.top { background: var(--panel); border-bottom: 1px solid var(--line); }
.top .in, main, .foot { max-width: 900px; margin: 0 auto; padding-left: 16px; padding-right: 16px; }
.top .in { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 700; color: var(--ink); margin-right: auto; }
main { padding-top: 20px; padding-bottom: 100px; }
.foot { padding-top: 12px; padding-bottom: 28px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.foot a { margin-right: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.stack > * + * { margin-top: 10px; }
button, .btn { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 6px 12px; border-radius: 6px; display: inline-block; }
button:hover:not(:disabled), .btn:hover { border-color: #aab0b8; text-decoration: none; }
button:disabled { opacity: .5; cursor: not-allowed; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.primary:hover:not(:disabled) { background: #2b48ab; border-color: #2b48ab; }
.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; }
.link:hover { text-decoration: underline; }
.danger { color: var(--red); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=date], input[type=number], select, textarea { font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); max-width: 100%; }
textarea { width: 100%; min-height: 90px; resize: vertical; }
textarea.mono { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: 14px; min-height: 130px; }
label.field { display: block; margin-bottom: 12px; font-weight: 600; font-size: 13px; }
label.field > input, label.field > select, label.field > textarea { display: block; margin-top: 4px; font-weight: 400; font-size: 15px; width: 100%; }
label.check { display: inline-flex; gap: 6px; align-items: center; margin-right: 12px; }
.bar { display: flex; height: 8px; background: #e7e8ea; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--green); } .bar .y { background: var(--yellow); }
.barline { display: flex; align-items: center; gap: 10px; }
.barline .bar { flex: 1; min-width: 50px; }
.barline .pct { font-size: 13px; color: var(--muted); width: 38px; text-align: right; flex: none; }
.source-row { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 12px; padding: 5px 0; align-items: center; }
.subject { margin-bottom: 26px; }
.subject > h2 { margin-top: 0; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.tile { background: var(--panel); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 10px 12px; cursor: pointer; user-select: none; min-width: 0; }
.tile:hover { border-color: #aab0b8; }
.tile.on { border-color: var(--accent); background: var(--accent-soft); }
.tile.none { opacity: .5; }
.tile .t { font-weight: 600; line-height: 1.25; }
.tile .m { font-size: 12px; color: var(--muted); margin: 2px 0 6px; display: flex; justify-content: space-between; gap: 6px; }
.tile .open { margin-top: 6px; font-size: 12px; }
.chapters { grid-column: 1 / -1; padding: 10px; border-radius: var(--radius); background: #eeeeeb; }
.chapters .tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.tile.random { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { padding: 4px 10px; font-size: 14px; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.opts { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 10px 12px; align-items: center; }
.opts > .l { font-weight: 600; font-size: 13px; }
.sticky { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 5; }
.sticky .in { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.count { font-weight: 700; font-size: 16px; }
.qhead { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.qbody { font-size: 16px; margin-bottom: 14px; }
.qbody p:last-child { margin-bottom: 0; }
.opt { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 6px; border: 1.5px solid var(--line); background: var(--panel); border-radius: var(--radius); }
.opt .ln { display: flex; gap: 10px; align-items: flex-start; }
.opt .mk { flex: none; width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid #9aa1aa; background: #fff; }
.opt .mk.radio { border-radius: 50%; } .opt .mk.box { border-radius: 4px; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .mk { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 3px #fff; }
.opt.ok { border-color: var(--green); background: var(--green-soft); opacity: 1; }
.opt.bad { border-color: var(--red); background: var(--red-soft); opacity: 1; }
.opt.locked { cursor: default; }
.opt:disabled { opacity: 1; cursor: default; }
.opt .tag { font-size: 12px; font-weight: 700; margin-left: auto; flex: none; }
.opt.ok .tag { color: var(--green); } .opt.bad .tag { color: var(--red); }
.opt .why { margin: 6px 0 0 28px; font-size: 14px; color: #40464e; }
.n { color: var(--muted); font-size: 12px; flex: none; margin-top: 3px; }
code { font-family: Consolas, "SF Mono", Menlo, monospace; font-size: .92em; background: #eef0f2; padding: 1px 4px; border-radius: 3px; }
.code { position: relative; margin: 10px 0; }
.code pre { margin: 0; background: var(--code); color: #e7e9ec; padding: 12px 42px 12px 14px; border-radius: 6px; overflow-x: auto; font: 13.5px/1.5 Consolas, "SF Mono", Menlo, monospace; }
.code .cp { position: absolute; top: 6px; right: 6px; padding: 4px; background: #363c46; border: 0; color: #e7e9ec; line-height: 0; }
.code .cp:hover { background: #4a515d !important; }
.verdict { display: inline-block; font-weight: 700; padding: 2px 10px; border-radius: 12px; font-size: 13px; }
.v-correct { background: var(--green-soft); color: #1f7a4a; } .v-incorrect, .v-revealed { background: var(--red-soft); color: #a73838; } .v-partial { background: var(--yellow-soft); color: #86690b; }
.feedback { margin-top: 12px; padding: 12px 14px; border-left: 3px solid var(--line); background: #fafafa; }
.feedback h3 { margin-top: 0; }
.sources { font-size: 13px; color: var(--muted); margin-top: 6px; }
.grid-nums { display: flex; flex-wrap: wrap; gap: 4px; }
.grid-nums button { width: 34px; padding: 3px 0; font-size: 13px; text-align: center; }
.grid-nums .done { background: var(--accent-soft); border-color: var(--accent); }
.grid-nums .mark { box-shadow: inset 0 -3px 0 var(--yellow); }
.grid-nums .cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 18px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #eceded; vertical-align: top; }
th { background: #f3f3f1; white-space: nowrap; }
th[data-a] { cursor: pointer; }
tr:last-child td { border-bottom: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 12px; }
.tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
.stars button { border: 0; background: none; padding: 0 1px; font-size: 16px; color: #c5c8cd; line-height: 1; }
.stars button.on { color: var(--yellow); }
.tree li { margin: 3px 0; } .tree ul { padding-left: 18px; margin: 4px 0; list-style: none; } ul.tree { padding-left: 0; list-style: none; margin: 0; }
.item { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.stat { font-size: 26px; font-weight: 700; line-height: 1.1; }
.stats3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.stats3 .panel { margin: 0; }
.modal-bg { position: fixed; inset: 0; background: rgba(20, 22, 26, .45); z-index: 20; display: flex; justify-content: center; align-items: flex-start; padding: 24px 12px; overflow-y: auto; }
.modal { background: var(--panel); border-radius: 10px; padding: 18px; width: 100%; max-width: 640px; }
.toast { position: fixed; top: 44px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 14px; z-index: 30; max-width: 90vw; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid #b8bcc2; border-top-color: var(--accent); border-radius: 50%; animation: s .7s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes s { to { transform: rotate(360deg); } }
.swatch { width: 92px; font-size: 11px; color: var(--muted); }
.swatch i { display: block; height: 36px; border-radius: 6px; border: 1px solid var(--line); margin-bottom: 3px; }
.gallery h2 { border-top: 1px solid var(--line); padding-top: 14px; }
.badge { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 8px; background: #eceded; color: #4a5059; font-weight: 600; }
@media (max-width: 560px) {
  .opts { grid-template-columns: 1fr; gap: 3px 0; } .opts > .l { margin-top: 8px; }
  .source-row { grid-template-columns: 1fr; gap: 2px; padding: 7px 0; }
}
</style>
</head>
<body>
<div class="banner">Disposable preview: dummy data, nothing is saved, no real Claude calls. Refreshing resets everything.</div>
<header class="top"><div class="in">
  <a class="brand" href="#/">Quiz App</a>

<script>
'use strict';
/* ---------- helpers ---------- */
let seedVal = 20261104;
const rnd = () => (seedVal = (seedVal * 1664525 + 1013904223) >>> 0) / 4294967296;
const DAY = 86400000, NOW = Date.now();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
const COPY = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const TICK = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l6 6L20 6"/></svg>';
function md(s) {
  return String(s ?? '').split(/```\w*\n?/).map((part, i) => i % 2
    ? `<div class="code"><pre>${esc(part.replace(/\n$/, ''))}</pre><button class="cp" data-a="copy" aria-label="Copy code" title="Copy">${COPY}</button></div>`
    : part.trim().split(/\n\s*\n/).filter(Boolean).map(p => `<p>${inline(p)}</p>`).join('')).join('');
}
const snippet = (s, n = 90) => { const t = String(s).replace(/```[\s\S]*?```/g, ' [code] ').replace(/[*`]/g, '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const dateStr = t => new Date(t).toISOString().slice(0, 10);
const sameSet = (a, b) => a.length === b.length && a.every(x => b.includes(x));
let uid = 0; const nid = p => p + (++uid);
function toast(m) { const t = document.getElementById('toast'); t.innerHTML = `<div class="toast">${esc(m)}</div>`; clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = '', 2600); }

/* ---------- dummy database ---------- */
const DB = {
  users: [{ id: 1, name: 'Admin', role: 'admin' }],
  subjects: [], exams: [], categories: [], sources: [], chapters: [], questions: [],
  explanations: [], quizzes: [], attempts: [], stats: {}, drafts: [], aiCalls: [],
  settings: { weights: { difficulty: 3, failure: 3, streak: 2, staleness: 1, rating: 1 }, max: 20, sort: 'random', prioritise: true },
};
const BATCH = 'Batch ' + dateStr(NOW - 7 * DAY);
const SEED = [
  { subject: 'OutSystems', id: 'os', name: 'OutSystems Associate Developer (O11)', mock: [40, 60, 70], days: 12, attempted: .42,
    cats: ['Data modelling', 'Logic', 'Screens & UI', 'Security', 'Integrations'],
    sources: [['Practice exam', 4, [['Practice exam 1', 42]]], ['Web question set', 2, [['Part 1', 24], ['Part 2', 18]]], ['Generated', 3, [[BATCH, 10]]]] },
  { subject: 'Java', id: 'ocp', name: 'Java SE 21 OCP', mock: [50, 120, 68], days: 48, attempted: .2,
    cats: ['Language basics', 'OOP', 'Collections & streams', 'Exceptions', 'Concurrency', 'Modules'],
    sources: [['Boyarsky study guide', 5, [['Chapter 1', 28], ['Chapter 2', 30], ['Chapter 3', 26], ['Chapter 4', 32], ['Chapter 5', 24], ['Chapter 6', 30]]], ['Online mock set', 3, [['Set A', 50], ['Set B', 50]]], ['Generated', 3, [[BATCH, 14]]]] },
  { subject: 'Claude', id: 'cdp', name: 'Claude Developer Professional', mock: [30, 60, 70], days: 90, attempted: .06,
    cats: ['Messages API', 'Tool use', 'Prompting', 'Costs & caching'],
    sources: [['Course notes', 4, [['Module 1', 18], ['Module 2', 16]]], ['Generated', null, [[BATCH, 8]]]] },
];
SEED.forEach(e => {
  let sub = DB.subjects.find(s => s.name === e.subject);
  if (!sub) DB.subjects.push(sub = { id: nid('sub'), name: e.subject });
  DB.exams.push({ id: e.id, subjectId: sub.id, name: e.name, mockQuestionCount: e.mock[0], mockTimeLimitMin: e.mock[1], passMarkPct: e.mock[2], examDate: dateStr(NOW + e.days * DAY), attempted: e.attempted });
  e.cats.forEach(c => DB.categories.push({ id: nid('cat'), examId: e.id, name: c, weight: null }));
  e.sources.forEach(([name, rating, chs]) => {
    const src = { id: nid('src'), examId: e.id, name, rating, origin: name === 'Generated' ? 'generated' : 'upload' };
    DB.sources.push(src);
    chs.forEach(([chName, n]) => { const ch = { id: nid('ch'), sourceId: src.id, name: chName, seedCount: n }; DB.chapters.push(ch); });
  });
});
const examOf = id => DB.exams.find(e => e.id === id);
const catsOf = id => DB.categories.filter(c => c.examId === id);
const srcsOf = id => DB.sources.filter(s => s.examId === id);
const chsOf = id => DB.chapters.filter(c => c.sourceId === id);
const srcById = id => DB.sources.find(s => s.id === id);
const chById = id => DB.chapters.find(c => c.id === id);
const catById = id => DB.categories.find(c => c.id === id);

function addQuestion(examId, sourceId, chapterId, categoryId, type, body, opts, x = {}) {
  const id = DB.questions.length + 1;
  const q = { id, examId, sourceId, chapterId, categoryId, type, body, hand: !!x.hand, lock: !!x.lock, model: x.model || null, keywords: x.keywords || [], flagged: x.flagged || null, deleted: false, externalId: 'q-' + id,
    options: (opts || []).map(([t, c, e], i) => ({ id: id * 100 + i, t, c: !!c, e: e || '' })) };
  DB.questions.push(q); return q;
}
function H(exam, src, ch, cat, type, body, opts, x) {
  const s = srcsOf(exam).find(o => o.name === src), c = chsOf(s.id).find(o => o.name === ch), k = catsOf(exam).find(o => o.name === cat);
  addQuestion(exam, s.id, c.id, k.id, type, body, opts, { ...x, hand: true });
}
/* Hand-written questions show the real formats. Everything else is generated filler, so the counts look realistic. */
H('os', 'Practice exam', 'Practice exam 1', 'Data modelling', 'single', 'In a one-to-many relationship between `Customer` and `Order`, where does the foreign key attribute belong?', [['On the `Customer` entity', 0], ['On the `Order` entity', 1, 'The "many" side holds a reference to the "one" side.'], ['On a separate junction entity', 0, 'A junction entity is used for many-to-many relationships.'], ['On both entities', 0]]);
H('os', 'Practice exam', 'Practice exam 1', 'Screens & UI', 'single', 'In a Reactive Web App, which screen event runs first?', [['On Ready', 0], ['On Render', 0], ['On Initialize', 1, 'On Initialize runs before the screen is rendered.'], ['On Destroy', 0]]);
H('os', 'Practice exam', 'Practice exam 1', 'Screens & UI', 'multi', 'Which of these are screen lifecycle events in a Reactive Web App? **Choose two.**', [['On Ready', 1], ['On Render', 1], ['Preparation', 0, 'Preparation belongs to Traditional Web Apps.'], ['On Begin Web Request', 0]]);
H('os', 'Web question set', 'Part 1', 'Logic', 'single', 'Where does a Client Action run in a Reactive Web App?', [['In the browser', 1], ['On the application server', 0, 'That describes a Server Action.'], ['In the database', 0], ['In Service Center', 0]]);
H('os', 'Web question set', 'Part 1', 'Data modelling', 'single', 'What is a Static Entity best suited to?', [['A fixed set of records defined at design time, such as status values', 1, 'Records are defined in Service Studio.'], ['Storing large volumes of user data', 0], ['Replacing every Aggregate', 0], ['Caching web service responses', 0]]);
H('os', 'Web question set', 'Part 2', 'Security', 'single', 'Which built-in function checks on the server whether a user has a role called `Manager`?', [['`CheckManagerRole`', 1], ['`GetRole(Manager)`', 0], ['`Manager.IsSet`', 0], ['`HasPermission(Manager)`', 0]]);
H('os', 'Generated', BATCH, 'Logic', 'free', 'Explain the difference between a **Server Action** and a **Client Action**, and when you would use each.', null, { model: 'A Client Action runs in the browser, so it suits UI logic and responsiveness. A Server Action runs on the server, so it suits database access, secure logic and integrations.', keywords: ['browser', 'server', 'database'] });
H('ocp', 'Boyarsky study guide', 'Chapter 1', 'Collections & streams', 'single', 'What does this code print?\n\n```java\nvar list = new ArrayList<>(List.of(1, 2, 3));\nlist.remove(Integer.valueOf(1));\nlist.remove(1);\nSystem.out.println(list);\n```', [['`[2]`', 1, '`remove(Object)` removes the value 1, then `remove(int)` removes index 1.'], ['`[3]`', 0, 'This would need the second call to remove index 0.'], ['`[1]`', 0], ['An exception is thrown', 0]]);
H('ocp', 'Boyarsky study guide', 'Chapter 1', 'Language basics', 'single', 'What does this code print?\n\n```java\nString s = "a";\ns.concat("b");\nSystem.out.println(s);\n```', [['`a`', 1, 'Strings are immutable, and the result of `concat` is discarded.'], ['`ab`', 0, 'This would need `s = s.concat("b")`.'], ['`b`', 0], ['It does not compile', 0]]);
H('ocp', 'Boyarsky study guide', 'Chapter 2', 'OOP', 'single', 'Which statement about records is true?', [['A record class is implicitly final', 1, 'It cannot be subclassed.'], ['A record can extend another class', 0, 'It already extends `java.lang.Record`.'], ['A record cannot implement interfaces', 0], ['Record component fields can be reassigned', 0]]);
H('ocp', 'Boyarsky study guide', 'Chapter 2', 'OOP', 'multi', 'Which statements about sealed classes are true? **Choose two.**', [['A permitted subclass must be declared `final`, `sealed` or `non-sealed`', 1], ['The `permits` clause can be omitted when the subclasses are in the same source file', 1], ['A permitted subclass can be in any module', 0], ['An enum can be declared `sealed`', 0]]);

function catAccuracy(examId) {
  return catsOf(examId).map(c => {
    const qs = new Set(DB.questions.filter(q => q.categoryId === c.id && !q.deleted).map(q => q.id));
    const recent = DB.attempts.filter(a => qs.has(a.questionId)).sort((x, y) => y.createdAt - x.createdAt).slice(0, 20);
    return { c, n: recent.length, acc: recent.length ? recent.filter(a => a.result === 'correct').length / recent.length : null };
  });
}
